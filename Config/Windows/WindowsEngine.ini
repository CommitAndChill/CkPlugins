[CkEditor]
; Keep a compatible local Zen server alive while the Windows desktop session is active.
KeepZenForDesktopSession=True

[Zen.AutoLaunch]
; Overlap editor sponsorship when a compatible local Zen server is already running.
OverlapEditorSponsor=True

[D3D12.AdapterSetup]
; Skip device probes for adapters that cannot win automatic editor GPU selection.
SkipDominatedProbes=True

[CkAngelscriptGenerator]
; Reuse startup AutoTest wrappers after validating inputs and generated files.
ReuseStartupAutoTestWrappers=True
